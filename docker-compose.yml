name: ai-notification-platform

networks:
  ai-notification:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  ollama_data:

x-nest-build: &nest-build
  context: .
  dockerfile: docker/nest-service.Dockerfile

x-nest-defaults: &nest-defaults
  networks: [ai-notification]
  restart: unless-stopped
  depends_on:
    otel-collector:
      condition: service_started

x-nest-env: &nest-env
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  # ---------------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Postgres on 127.0.0.1:5432 that silently wins the "localhost"
      # resolution over Docker's port-forward, so 5432:5432 here would
      # route host clients to the wrong database entirely.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ai-notification.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-notification]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  # ---------------------------------------------------------------------
  # Observability
  #
  #   NestJS Services -> OpenTelemetry SDK -> OTLP -> otel-collector
  #                                                       |
  #                                    +------------------+------------------+
  #                                    |                  |                  |
  #                                 jaeger            prometheus            loki
  #                                    |                  |                  |
  #                                    +------------------+------------------+
  #                                                       |
  #                                                    grafana
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (scraped by prometheus)
    depends_on: [jaeger, loki]
    networks: [ai-notification]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI + query API
    networks: [ai-notification]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [ai-notification]

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    networks: [ai-notification]

  # Per-container CPU/memory, scraped by prometheus -- feeds the
  # platform-health Grafana dashboard (resource usage pillar).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks: [ai-notification]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Grafana blocks iframe embedding by default (clickjacking
      # protection, sends X-Frame-Options: deny) -- the tenant/admin
      # observability pages embed our own dashboards via tenant-locked
      # URLs, so embedding is an intentional, trusted use here.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3011:3000"
    depends_on: [prometheus, loki, jaeger]
    networks: [ai-notification]

  # ---------------------------------------------------------------------
  # App services (NestJS)
  # ---------------------------------------------------------------------
  api-gateway:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/api-gateway"
        APP_DIR: api-gateway
    environment:
      <<: *nest-env
      PORT: "8000"
      IDENTITY_AUTH_GRPC_ADDRESS: identity-service:50152
      TENANT_GRPC_ADDRESS: tenant-service:50153
      EVENT_GRPC_ADDRESS: event-service:50154
      RULE_ENGINE_GRPC_ADDRESS: rule-engine-service:50156
      NOTIFICATION_GRPC_ADDRESS: notification-service:50157
      AI_GRPC_ADDRESS: ai-service:50155
      TEMPLATE_GRPC_ADDRESS: template-service:50159
      ANALYTICS_GRPC_ADDRESS: analytics-service:50160
      AUDIT_GRPC_ADDRESS: audit-service:50161
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/auth/google/callback}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Forwards Stripe test-mode webhook events to api-gateway for local
  # dev -- Stripe's servers can't reach localhost directly, so this
  # stands in for a public webhook endpoint. Opt-in via the "stripe"
  # profile (add COMPOSE_PROFILES=stripe to .env) so the stack still
  # comes up cleanly with no Stripe credentials at all.
  #
  # Targets host.docker.internal rather than the api-gateway service name
  # because api-gateway's host port 8000 is reachable there either way --
  # whether api-gateway is this compose file's own container or running
  # natively on the host (see scripts/dev.sh, the local-dev path where
  # only infra runs in Docker). No depends_on for the same reason: this
  # container doesn't require api-gateway to be a compose-managed service.
  #
  # One-time setup: after this container is up, `docker compose logs
  # stripe-cli` prints "Your webhook signing secret is whsec_...".
  # Stripe's CLI keeps this secret stable across restarts for a given
  # API key, so paste it into STRIPE_WEBHOOK_SECRET in .env once and
  # it never needs to change.
  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    command: listen --api-key ${STRIPE_SECRET_KEY:-} --forward-to host.docker.internal:8000/webhooks/stripe
    profiles: ["stripe"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ai-notification]

  identity-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/identity-service"
        APP_DIR: identity-service
    environment:
      <<: *nest-env
      AUTH_GRPC_PORT: "50152"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_db
      JWT_SECRET: dev-only-insecure-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 1h
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tenant-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/tenant-service"
        APP_DIR: tenant-service
    environment:
      <<: *nest-env
      TENANT_GRPC_PORT: "50153"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tenant_db
      IDENTITY_AUTH_GRPC_ADDRESS: identity-service:50152
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/event-service"
        APP_DIR: event-service
    environment:
      <<: *nest-env
      EVENT_GRPC_PORT: "50154"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      IDENTITY_AUTH_GRPC_ADDRESS: identity-service:50152
      TENANT_GRPC_ADDRESS: tenant-service:50153
      RULE_ENGINE_GRPC_ADDRESS: rule-engine-service:50156
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Local LLM runtime for ai-service (chat model: qwen2.5:0.5b -- the
  # balance point found after: llama3.1:8b OOM'd, llama3.2:3b took minutes
  # per call with RAG context, llama3.2:1b was still too slow, and
  # smollm2:135m was fast but produced incoherent output (wrong-shaped
  # summaries, a date string as a "recommendation"). Qwen's small models
  # are specifically tuned for instruction-following/structured output
  # relative to their size -- coherent responses in ~5s on this hardware.
  # embeddings for RAG duplicate-detection retrieval: nomic-embed-text).
  # No API key, no billing -- runs entirely in-network.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks: [ai-notification]

  # One-shot: pulls the models ai-service needs, then exits. ai-service
  # itself doesn't wait on this -- a request against a not-yet-pulled
  # model just fails gracefully into a "failed" EventAnalysis row, same as
  # any other provider error.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5:0.5b && ollama pull nomic-embed-text",
      ]
    networks: [ai-notification]

  ai-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/ai-service"
        APP_DIR: ai-service
    environment:
      <<: *nest-env
      AI_GRPC_PORT: "50155"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TENANT_GRPC_ADDRESS: tenant-service:50153
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started

  rule-engine-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/rule-engine-service"
        APP_DIR: rule-engine-service
    environment:
      <<: *nest-env
      RULE_ENGINE_GRPC_PORT: "50156"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rule_engine_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TENANT_GRPC_ADDRESS: tenant-service:50153
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/notification-service"
        APP_DIR: notification-service
    environment:
      <<: *nest-env
      NOTIFICATION_GRPC_PORT: "50157"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TENANT_GRPC_ADDRESS: tenant-service:50153
      CHANNEL_GRPC_ADDRESS: channel-service:50158
      TEMPLATE_GRPC_ADDRESS: template-service:50159
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Stateless connector layer -- no database, no RabbitMQ dependency. Its
  # only caller is notification-service, over gRPC.
  channel-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/channel-service"
        APP_DIR: channel-service
    environment:
      <<: *nest-env
      CHANNEL_GRPC_PORT: "50158"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}

  template-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/template-service"
        APP_DIR: template-service
    environment:
      <<: *nest-env
      TEMPLATE_GRPC_PORT: "50159"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_db
      TENANT_GRPC_ADDRESS: tenant-service:50153
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy

  analytics-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/analytics-service"
        APP_DIR: analytics-service
    environment:
      <<: *nest-env
      ANALYTICS_GRPC_PORT: "50160"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TENANT_GRPC_ADDRESS: tenant-service:50153
      CHANNEL_COST_JSON: '{"email":0.0001,"webhook":0,"dashboard":0}'
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/audit-service"
        APP_DIR: audit-service
    environment:
      <<: *nest-env
      AUDIT_GRPC_PORT: "50161"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/audit_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TENANT_GRPC_ADDRESS: tenant-service:50153
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Next.js SaaS dashboard -- the browser talks to api-gateway directly
  # (NEXT_PUBLIC_* vars below), so this is the one other service besides
  # api-gateway that legitimately needs a host port.
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/web-service.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [ai-notification]

  # ---------------------------------------------------------------------
  # App services (Python)
  # ---------------------------------------------------------------------
  prediction-service:
    restart: unless-stopped
    build:
      context: apps/prediction-service
    environment:
      PORT: "8011"
    ports:
      - "8011:8011"
    networks: [ai-notification]
