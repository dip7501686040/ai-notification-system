name: ai-notification-platform

networks:
  ai-notification:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:

x-nest-build: &nest-build
  context: .
  dockerfile: docker/nest-service.Dockerfile

x-nest-defaults: &nest-defaults
  networks: [ai-notification]
  restart: unless-stopped
  depends_on:
    otel-collector:
      condition: service_started

x-nest-env: &nest-env
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  # ---------------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Postgres on 127.0.0.1:5432 that silently wins the "localhost"
      # resolution over Docker's port-forward, so 5432:5432 here would
      # route host clients to the wrong database entirely.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ai-notification.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-notification]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ai-notification]

  # ---------------------------------------------------------------------
  # Observability
  #
  #   NestJS Services -> OpenTelemetry SDK -> OTLP -> otel-collector
  #                                                       |
  #                                    +------------------+------------------+
  #                                    |                  |                  |
  #                                 jaeger            prometheus            loki
  #                                    |                  |                  |
  #                                    +------------------+------------------+
  #                                                       |
  #                                                    grafana
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (scraped by prometheus)
    depends_on: [jaeger, loki]
    networks: [ai-notification]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI + query API
    networks: [ai-notification]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [ai-notification]

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    networks: [ai-notification]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3011:3000"
    depends_on: [prometheus, loki, jaeger]
    networks: [ai-notification]

  # ---------------------------------------------------------------------
  # App services (NestJS)
  # ---------------------------------------------------------------------
  api-gateway:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/api-gateway"
        APP_DIR: api-gateway
    environment:
      <<: *nest-env
      PORT: "8000"
      IDENTITY_AUTH_GRPC_ADDRESS: identity-service:50152
    ports:
      - "8000:8000"

  identity-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/identity-service"
        APP_DIR: identity-service
    environment:
      <<: *nest-env
      PORT: "8001"
      AUTH_GRPC_PORT: "50152"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_db
      JWT_SECRET: dev-only-insecure-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 1h
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  tenant-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/tenant-service"
        APP_DIR: tenant-service
    environment:
      <<: *nest-env
      PORT: "8002"
    ports:
      - "8002:8002"

  event-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/event-service"
        APP_DIR: event-service
    environment:
      <<: *nest-env
      PORT: "8003"
    ports:
      - "8003:8003"

  ai-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/ai-service"
        APP_DIR: ai-service
    environment:
      <<: *nest-env
      PORT: "8004"
    ports:
      - "8004:8004"

  rule-engine-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/rule-engine-service"
        APP_DIR: rule-engine-service
    environment:
      <<: *nest-env
      PORT: "8005"
    ports:
      - "8005:8005"

  notification-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/notification-service"
        APP_DIR: notification-service
    environment:
      <<: *nest-env
      PORT: "8006"
    ports:
      - "8006:8006"

  channel-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/channel-service"
        APP_DIR: channel-service
    environment:
      <<: *nest-env
      PORT: "8007"
    ports:
      - "8007:8007"

  template-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/template-service"
        APP_DIR: template-service
    environment:
      <<: *nest-env
      PORT: "8008"
    ports:
      - "8008:8008"

  analytics-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/analytics-service"
        APP_DIR: analytics-service
    environment:
      <<: *nest-env
      PORT: "8009"
    ports:
      - "8009:8009"

  audit-service:
    <<: *nest-defaults
    build:
      <<: *nest-build
      args:
        APP_NAME: "@ai-notification/audit-service"
        APP_DIR: audit-service
    environment:
      <<: *nest-env
      PORT: "8010"
    ports:
      - "8010:8010"

  # ---------------------------------------------------------------------
  # App services (Python)
  # ---------------------------------------------------------------------
  prediction-service:
    restart: unless-stopped
    build:
      context: apps/prediction-service
    environment:
      PORT: "8011"
    ports:
      - "8011:8011"
    networks: [ai-notification]
