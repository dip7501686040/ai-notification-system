# One ApplicationSet (list generator) covering all 11 NestJS services, since
# they share the same chart (infra/k8s/charts/nest-service) and only differ
# by which per-service values file gets layered on top. Targets the floci
# environment specifically — a parallel nest-services-aws.yaml (pointing at
# infra/k8s/environments/aws/ and a real cluster destination) is the AWS
# equivalent, added once the real cluster exists.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nest-services-floci
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: api-gateway
          - service: identity-service
          - service: tenant-service
          - service: event-service
          - service: ai-service
          - service: rule-engine-service
          - service: notification-service
          - service: channel-service
          - service: template-service
          - service: analytics-service
          - service: audit-service
  template:
    metadata:
      name: "{{service}}"
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: https://github.com/dip7501686040/ai-notification-system.git
          targetRevision: infra/floci-gitops
          path: infra/k8s/charts/nest-service
          helm:
            releaseName: "{{service}}"
            valueFiles:
              - $values/infra/k8s/environments/floci/values-{{service}}.yaml
        - repoURL: https://github.com/dip7501686040/ai-notification-system.git
          targetRevision: infra/floci-gitops
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: ai-notification
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
