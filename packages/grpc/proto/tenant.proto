syntax = "proto3";

package tenant.v1;

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantForUserRequest {
  string requester_id = 1;
  string tenant_id = 2;
}

message TenantMessage {
  string id = 1;
  string name = 2;
  string slug = 3;
  string plan = 4;
  string status = 5;
  string settings_json = 6;
  string created_at = 7;
  string updated_at = 8;
}

message GetTenantResponse {
  bool found = 1;
  TenantMessage tenant = 2;
}

message CheckMembershipRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message CheckMembershipResponse {
  bool is_member = 1;
  string role = 2;
}

message MemberMessage {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string role = 4;
  string created_at = 5;
}

// Mirrors RawListQuery (packages/common/src/list-query.ts). Empty string
// means "not provided" for every field here.
message ListQuery {
  string page = 1;
  string limit = 2;
  string search = 3;
  string sort_fields = 4;
  string sort_type = 5;
}

message SuccessResponse {
  bool success = 1;
}

message CreateTenantRequest {
  string requester_id = 1;
  string name = 2;
  string slug = 3;
  string plan = 4;
}

message TenantWithRoleMessage {
  TenantMessage tenant = 1;
  string role = 2;
}

message ListTenantsRequest {
  string requester_id = 1;
  ListQuery query = 2;
}

message ListTenantsResponse {
  repeated TenantWithRoleMessage list = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Empty string for name/plan/status/settings_json means "leave unchanged"
// (none of those are ever legitimately empty once a tenant exists).
message UpdateTenantRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string name = 3;
  string plan = 4;
  string status = 5;
  string settings_json = 6;
}

message DeleteTenantRequest {
  string requester_id = 1;
  string tenant_id = 2;
}

message ListMembersRequest {
  string requester_id = 1;
  string tenant_id = 2;
  ListQuery query = 3;
}

message ListMembersResponse {
  repeated MemberMessage list = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AddMemberRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string role = 4;
}

message UpdateMemberRoleRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string role = 4;
}

message RemoveMemberRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}

// API keys (FR-10/FR-2): raw_key is only ever present in the
// create/rotate responses -- never stored, never re-displayable, never
// part of ApiKeyMessage itself.
message ApiKeyMessage {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string key_prefix = 4;
  int32 rate_limit = 5;
  bool revoked = 6;
  string last_used_at = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CreateApiKeyRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string name = 3;
  int32 rate_limit = 4;
}

message CreateApiKeyResponse {
  ApiKeyMessage api_key = 1;
  string raw_key = 2;
}

message ListApiKeysRequest {
  string requester_id = 1;
  string tenant_id = 2;
  ListQuery query = 3;
}

message ListApiKeysResponse {
  repeated ApiKeyMessage list = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message RotateApiKeyRequest {
  string requester_id = 1;
  string api_key_id = 2;
}

message RotateApiKeyResponse {
  ApiKeyMessage api_key = 1;
  string raw_key = 2;
}

message RevokeApiKeyRequest {
  string requester_id = 1;
  string api_key_id = 2;
}

// Internal-only (no requester_id) -- called by api-gateway's guard, not
// routed through a human requester.
message ValidateApiKeyRequest {
  string raw_key = 1;
}

message ValidateApiKeyResponse {
  bool valid = 1;
  string tenant_id = 2;
  string api_key_id = 3;
  int32 rate_limit = 4;
}

// Platform-wide (Super Admin) -- not scoped to the caller's own
// memberships. requester_id is independently re-verified as a super
// admin by tenant-service itself, not just trusted from the gateway.
message ListAllTenantsRequest {
  string requester_id = 1;
  ListQuery query = 2;
}

message ListAllTenantsResponse {
  repeated TenantMessage list = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SetTenantStatusRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string status = 3;
}

// Billing (real Stripe integration, test mode): tenant-service owns
// every actual Stripe API call. api-gateway only verifies the webhook
// signature at the public HTTP edge, then forwards the normalized event
// here via ApplyStripeWebhookEvent -- no requester_id, api-gateway has
// already established this is a genuine, signed Stripe event.
message CreateCheckoutSessionRequest {
  string requester_id = 1;
  string tenant_id = 2;
  string plan = 3;
}

message BillingUrlResponse {
  string url = 1;
}

message CreatePortalSessionRequest {
  string requester_id = 1;
  string tenant_id = 2;
}

message CancelSubscriptionRequest {
  string requester_id = 1;
  string tenant_id = 2;
}

message ApplyStripeWebhookEventRequest {
  string kind = 1;
  string tenant_id = 2;
  string plan = 3;
  string subscription_id = 4;
}

service Tenant {
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc GetTenantForUser(GetTenantForUserRequest) returns (TenantMessage);
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
  rpc CreateTenant(CreateTenantRequest) returns (TenantMessage);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (TenantMessage);
  rpc DeleteTenant(DeleteTenantRequest) returns (SuccessResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (MemberMessage);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (MemberMessage);
  rpc RemoveMember(RemoveMemberRequest) returns (SuccessResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc RotateApiKey(RotateApiKeyRequest) returns (RotateApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (SuccessResponse);
  rpc ValidateApiKey(ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
  rpc ListAllTenants(ListAllTenantsRequest) returns (ListAllTenantsResponse);
  rpc SetTenantStatus(SetTenantStatusRequest) returns (TenantMessage);
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (BillingUrlResponse);
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (BillingUrlResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (SuccessResponse);
  rpc ApplyStripeWebhookEvent(ApplyStripeWebhookEventRequest) returns (SuccessResponse);
}
