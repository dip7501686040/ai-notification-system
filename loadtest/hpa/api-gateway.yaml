# Phase F -- HPA for the one clean CPU-scaling candidate: api-gateway.
# No DB of its own, so it does not hit the Postgres 100-connection ceiling
# that blocks the DB-owning services.
#
# averageUtilization is measured against resources.requests.cpu (50m in the
# nest-service chart), NOT the limit. 60% of 50m = 30m average before a
# scale-out -- deliberately eager, because the 250m limit is so low that
# the pod is effectively saturated well before "60% of the limit".
#
# maxReplicas: 3 -- hard ceiling on an 8 GB host (~250Mi working set/pod).
#
# Requires the ArgoCD `ignoreDifferences` on /spec/replicas to be committed
# first (plan Phase 3a), otherwise selfHeal reverts every scale event to 1.
#
#   kubectl apply -f loadtest/hpa/api-gateway.yaml
#   kubectl get hpa -n ai-notification -w
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: ai-notification
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
